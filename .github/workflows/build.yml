name: Build OpenCode for Termux

on:
  push:
    branches:
      - main
      - dev
      - master
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'OpenCode version/tag to build (default: dev)'
        required: false
        default: 'dev'
      architectures:
        description: 'Comma-separated architectures'
        required: false
        default: 'aarch64,arm,amd64'
      variants:
        description: 'Comma-separated variants'
        required: false
        default: 'pacman,apt'

permissions:
  contents: read
  packages: write
  actions: write
  id-token: write

env:
  OPENCODE_REPO: 'https://github.com/anomalyco/opencode.git'

jobs:
  build-pacman:
    name: Build pacman variant (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            bun_arch: arm64
            docker_arch: arm64
          - arch: arm
            bun_arch: arm
            docker_arch: arm
          - arch: amd64
            bun_arch: x64
            docker_arch: amd64
    timeout-minutes: 60
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pacman variant
        id: build
        run: |
          VERSION="${{ github.event.inputs.opencode_version || 'dev' }}"
          ./build-pacman.sh ${{ matrix.arch }} ${{ matrix.bun_arch }} "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.arch }}-pacman
          path: out/opencode-*-${{ matrix.arch }}-pacman.tar.gz
          retention-days: 30

  build-apt:
    name: Build apt variant (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            bun_arch: arm64
          - arch: arm
            bun_arch: arm
          - arch: amd64
            bun_arch: x64
    timeout-minutes: 60
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Build apt variant
        id: build
        run: |
          VERSION="${{ github.event.inputs.opencode_version || 'dev' }}"
          ./build-apt.sh ${{ matrix.arch }} ${{ matrix.bun_arch }} "${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.arch }}-apt
          path: out/opencode-*-${{ matrix.arch }}-apt.tar.gz
          retention-days: 30

  release:
    name: Create Release
    needs: [build-pacman, build-apt]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: opencode-*
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          # Get version from the built artifacts
          for f in artifacts/opencode-*.tar.gz; do
            [ -f "$f" ] || continue
            basename "$f" | sed -E 's/opencode-.+-([0-9]+\.[0-9]+\.[0-9]+(-[a-z]+)?)\.tar\.gz/\1/p' | head -1
            break
          done

      - name: Create GitHub Release
        run: |
          VERSION=$(cat artifacts/VERSION 2>/dev/null || echo "dev-$(date +%Y%m%d)")
          gh release create "v${VERSION}-termux" \
            --title "OpenCode ${VERSION} for Termux" \
            --notes "Pre-built OpenCode binaries for Termux (Android).

            **Architectures:** aarch64 (armv8), arm (armv7), amd64 (x86_64)
            **Variants:** pacman (glibc + Bun), apt (bionic libc)
            
            ## Installation
            
            ### pacman variant (recommended - includes Bun)
            \`\`\`bash
            pkg install tur/bun
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/v${VERSION}-termux/opencode-linux-aarch64-pacman.tar.gz | tar -xz -C \$PREFIX/bin
            opencode
            \`\`\`
            
            ### apt variant (bionic libc, no Bun)
            \`\`\`bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/v${VERSION}-termux/opencode-linux-aarch64-apt.tar.gz | tar -xz -C \$PREFIX/bin
            opencode
            \`\`\`" \
            artifacts/**/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}