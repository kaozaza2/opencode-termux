name: opencode-termux

on:
  push:
    branches:
      - master
      - dev
    paths:
      - '.github/workflows/opencode-termux.yml'
      - 'build.sh'
      - 'package.sh'
      - 'Dockerfile.build'
      - 'patches/**'
      - 'vendor/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      opencode_ref:
        description: 'OpenCode ref. `latest` (default) picks the highest published v2.x.y tag; `v2` is the branch head. `2.0` and `dev` are v1 lines.'
        required: false
        default: 'latest'
      version:
        description: 'Version baked into the binary. Empty uses the release version of the checked-out tag, or a 0.0.0-dev-<sha> preview for a branch.'
        required: false
        default: ''
      bun_version:
        description: 'Override the Bun used to compile. It is the runtime embedded in the binary, and @opencode/script enforces ^<checkout pin>.'
        required: false
        default: ''
      with_web_ui:
        description: 'Embed the app assets (adds ~30 MB, only `opencode serve` needs them)'
        required: false
        type: boolean
        default: false
      release:
        description: 'Publish a GitHub release with the tarball'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Empty: build.sh reads the required version from the checkout's packageManager
  # field, since @opencode/script enforces ^<that pin> and it moves.
  BUN_VERSION: ${{ github.event.inputs.bun_version || '' }}

jobs:
  build:
    name: Build opencode-linux-arm64-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ref.outputs.version }}
    steps:
      - name: Checkout opencode-termux
        uses: actions/checkout@v7

      # node-gyp runs native postinstall scripts during `bun install` and needs
      # Node >= 22; the runner image can ship an older one.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build
        id: ref
        env:
          OPENCODE_REPO: 'https://github.com/anomalyco/opencode.git'
          OPENCODE_REF: ${{ github.event.inputs.opencode_ref || 'latest' }}
          VERSION: ${{ github.event.inputs.version || '' }}
          BUN_VERSION: ${{ env.BUN_VERSION }}
          BUILD_WEB_UI: ${{ github.event.inputs.with_web_ui || '0' }}
        run: ./build.sh "$VERSION"

      - name: Upload android binary
        uses: actions/upload-artifact@v7
        with:
          name: opencode-dist
          retention-days: 7
          if-no-files-found: error
          path: opencode/packages/cli/dist/cli-linux-arm64-android/bin/opencode

  # One tarball, not one per package manager: stock Termux and termux-pacman
  # both run on bionic and install identical bytes.
  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout opencode-termux
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: opencode-dist
          path: dist

      - name: Package
        env:
          # The upload flattens the dist layout, so point package.sh at the leaf.
          DISTDIR: ${{ github.workspace }}/dist
        run: ./package.sh "${{ needs.build.outputs.version }}"

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: opencode-tarball
          path: out/opencode-termux-*.tar.gz
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create Release
    needs:
      - build
      - package
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout opencode-termux
        uses: actions/checkout@v7

      - name: Download tarball
        uses: actions/download-artifact@v8
        with:
          name: opencode-tarball
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="${VERSION}-termux"
          ls -la artifacts/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tar.gz --clobber
          else
            gh release create "$TAG" \
              --title "OpenCode ${VERSION} for Termux" \
              --notes "Pre-built OpenCode binaries for Termux (Android).

          **Architecture:** aarch64 (armv8), bionic libc.
          Stock Termux (apt/pkg) and termux-pacman install the same binary.

          Install with: \`tar -xzf opencode-termux-<version>.tar.gz -C \$PREFIX/bin\`" \
              artifacts/*.tar.gz
          fi
